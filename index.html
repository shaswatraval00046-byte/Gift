<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Valentine ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="floatingNames"></div>
  <div class="card">
    <h1>Hey Beautiful ❤️</h1>

    <p>
      I would really like to take you out on this special day and make love to you.<br>
      Will you be my valentine, baby? 💖
    </p>

    <div class="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 💔</button>
    </div>

    <!-- Hidden image -->
     <img id="loveImage" src="image.jpg"" alt="Love" />


  </div>
  <audio id="bgMusic" src="bg.mp3" loop></audio>
<audio id="yesMusic" src="yes.mp3" loop></audio>
<audio id="errorSound" src="no.mp3"></audio>
<div id="confetti"></div>

<script>
  function sendResponse(value) {
  fetch("https://docs.google.com/forms/u/0/d/e/1FAIpQLSfFeQDjJBQCtMpjC-4DmyBYFkYsGijejQzn8XqztvkPtfZYsA/formResponse", {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "entry.2054187363_sentinel" + encodeURIComponent(value)
  });
}

const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const loveImage = document.getElementById("loveImage");

const yesMusic = document.getElementById("yesMusic");
const errorSound = document.getElementById("errorSound");

const confetti = document.getElementById("confetti");
const floatingNames = document.getElementById("floatingNames");

// CHANGE THESE TO HER REAL NAME + NICKNAMES
const names = [
  "CHANDRIKA",
  "Babyluu",
  "Honey talli",
  "My gawar girl",
  "My kuchupuchu"
];

// Create floating names
names.forEach(name => {
  const span = document.createElement("span");
  span.innerText = name;
  span.className = "floatName";

  // Random position
  span.style.left = Math.random() * 100 + "vw";

  // Random speed
  span.style.animationDuration = 10 + Math.random() * 10 + "s";

  // Random font size
  span.style.fontSize = 16 + Math.random() * 20 + "px";

  floatingNames.appendChild(span);
});

noBtn.addEventListener("click", () => {
  errorSound.currentTime = 0;
  errorSound.play();
  sendResponse("NO");

  const bgMusic = document.getElementById("bgMusic");

// Start background music on first interaction
document.body.addEventListener("click", () => {
  bgMusic.volume = 0.4;
  bgMusic.play();
}, { once: true });


  const x = Math.random() * 250 - 125;
  const y = Math.random() * 250 - 125;

  noBtn.style.transform = `translate(${x}px, ${y}px) rotate(20deg)`;
});
yesBtn.addEventListener("click", () => {
  sendResponse("YES");

  bgMusic.pause();
  yesMusic.play();

  loveImage.style.display = "block";

  yesBtn.style.display = "none";
  noBtn.style.display = "none";

  confetti.innerHTML = "🎉 💖 🎊 💕 🎉 💗 🎊 💘";
  confetti.style.fontSize = "40px";
});
</script>





</body>
</html>
